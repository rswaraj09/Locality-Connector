# ---- Production profile ----
# Activate with SPRING_PROFILES_ACTIVE=prod. Unlike application-dev.properties,
# this file intentionally provides NO fallback for jwt.secret or any other credential -
# the app must fail fast at startup if a required secret is missing, rather than
# silently running with a known/dev value.

# Cookies must always be HTTPS-only in production. AWS deployments should terminate
# TLS at the load balancer (ALB) and forward to the app over the VPC; leave this true.
app.cookie.secure=true

# Trim request logging noise; raise to DEBUG only when actively troubleshooting.
logging.level.com.example.localityconnector=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN

# Never expose stack traces or internal error details to clients in production.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Actuator: keep the surface minimal in production; health/info stay public for the
# ALB health check, everything else (including /actuator/env, /actuator/beans) is
# locked to ADMIN by SecurityConfig and additionally excluded here.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
