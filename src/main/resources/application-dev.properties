# --- Dev-only JWT secret (overrides application.properties for local runs) ---
jwt.secret=${JWT_SECRET_KEY:dev-only-local-secret-key-at-least-32-characters-long!!}

# --- Dev runs over plain HTTP on localhost, so the Secure cookie flag must be off
# here or browsers will silently drop the jwt cookie. Never used in production. ---
app.cookie.secure=${COOKIE_SECURE:false}

mappls.api.key=${MAPPLS_API_KEY:}
mappls.client.id=${MAPPLS_CLIENT_ID:}
mappls.client.secret=${MAPPLS_CLIENT_SECRET:}

# Google Maps API Configuration
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}
google.maps.geocoding.api.key=${GOOGLE_GEOCODING_API_KEY:}
