<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Locality Connector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-0: #0a0908;
            --bg-1: #14100d;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.12);
            --ember: #ff6b35;
            --text-hi: #f5f0ea;
            --text-mid: #b7a99b;
            --radius-lg: 22px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, var(--bg-0), var(--bg-1));
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            color: var(--text-hi);
        }
        .container {
            width: 100%; max-width: 440px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px 36px; margin: 20px;
            backdrop-filter: blur(24px);
        }
        h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--text-hi); }
        p.sub { font-size: 0.9rem; color: var(--text-mid); margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-mid); }
        input {
            width: 100%; padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 12px; color: #fff; font-size: 0.95rem;
        }
        input:focus { outline: none; border-color: var(--ember); }
        .btn {
            width: 100%; padding: 14px;
            background: var(--ember); color: #fff;
            border: none; border-radius: 12px;
            font-weight: 700; font-size: 0.95rem; cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover { background: #ff8555; }
        .message { margin-top: 18px; font-size: 0.9rem; padding: 12px; border-radius: 8px; display: none; }
        .message.success { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
        .message.error { background: rgba(255, 97, 97, 0.15); color: #ff6161; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset Password</h1>
        <p class="sub">Enter your new password below.</p>
        <div id="message" class="message"></div>
        <form id="reset-password-form">
            <input type="hidden" id="token" name="token">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword" placeholder="Minimum 8 characters" required minlength="8">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter new password" required minlength="8">
            </div>
            <button type="submit" class="btn" id="submit-btn">Reset Password</button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        if (token) {
            document.getElementById('token').value = token;
        }

        document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const tokenVal = document.getElementById('token').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('message');
            const btn = document.getElementById('submit-btn');

            if (!tokenVal) {
                messageDiv.textContent = 'Invalid or missing reset token.';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                return;
            }
            if (newPassword !== confirmPassword) {
                messageDiv.textContent = 'Passwords do not match.';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                return;
            }

            btn.disabled = true; btn.textContent = 'Updating...';

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: tokenVal, newPassword: newPassword })
                });
                const result = await response.json();
                if (response.ok) {
                    messageDiv.textContent = result.data.message || 'Password reset successfully! You can now log in.';
                    messageDiv.className = 'message success';
                    setTimeout(() => { window.location.href = '/user/login'; }, 2500);
                } else {
                    messageDiv.textContent = result.error || 'Password reset failed.';
                    messageDiv.className = 'message error';
                    btn.disabled = false; btn.textContent = 'Reset Password';
                }
            } catch (err) {
                messageDiv.textContent = 'Network error occurred.';
                messageDiv.className = 'message error';
                btn.disabled = false; btn.textContent = 'Reset Password';
            } finally {
                messageDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
